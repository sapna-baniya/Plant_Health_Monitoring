project_name: plant_health_maskrcnn_3class
num_classes: 4   # background + 3 project classes
class_names:
  - background
  - healthy_leaf
  - healthy_stem
  - diseased_leaf

data:
  train_images: data/images/train
  val_images: data/images/val
  test_images: data/images/test
  train_annotations: data/annotations/train.json
  val_annotations: data/annotations/val.json
  test_annotations: data/annotations/test.json

training:
  image_size: 512
  batch_size: 2
  epochs: 20
  freeze_backbone_epochs: 3
  learning_rate: 0.0005
  backbone_learning_rate: 0.00005
  weight_decay: 0.0001
  momentum: 0.9
  num_workers: 0
  device: auto
  output_dir: outputs/checkpoints
  use_augmentation: true
  early_stopping_patience: 5

augmentation:
  horizontal_flip_prob: 0.5
  brightness: 0.25
  contrast: 0.25
  saturation: 0.15
  hue: 0.05
